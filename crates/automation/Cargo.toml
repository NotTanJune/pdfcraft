[package]
name = "pdfcraft-automation"
description = "Agent control for PdfCraft: a headless tool set over the engine and an MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-engine = { workspace = true }
pdfcraft-cos = { workspace = true }
pdfcraft-render = { workspace = true }
pdfcraft-organize = { workspace = true }
pdfcraft-platform = { workspace = true }
# `ai_ask` and `link_preview` reach the network, and only when called (opt-in per call).
pdfcraft-assist = { workspace = true }
# `cloud_*` reach Google Drive and OneDrive, only when called and only for a connected account.
pdfcraft-clouddrive = { workspace = true }
# `library_*` and `vault_*`: the document library and the encrypted vault.
pdfcraft-library = { workspace = true }
craft-prc = { workspace = true }
pdfcraft-prc-render = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
tempfile = "3.27"
base64 = { version = "0.23", optional = true }
craft-jsonrpc = { workspace = true, optional = true }
craft-mcp-server = { workspace = true, optional = true }


[features]
default = ["mcp"]
# The MCP server module. Opt-in at run time either way; disable to leave it out of the build.
mcp = ["dep:base64", "dep:craft-jsonrpc", "dep:craft-mcp-server"]

[dev-dependencies]
# A loopback HTTP server, so the network tools' tests never leave the machine.
pdfcraft-assist = { workspace = true, features = ["mock"] }
pdfcraft-clouddrive = { workspace = true, features = ["mock"] }
# Synthetic printer profiles for the app-managed print colour tests.
craft-cms = { workspace = true }
craft-image-codecs = { workspace = true }
# Word exports read back as Word reads them.
craft-docx = { workspace = true }
craft-wordmodel = { workspace = true }
# Excel files written and read back, for the in-process conversion tests.
craft-xlsx = { workspace = true, features = ["test-support"] }
pdfcraft-fonts = { workspace = true }
flate2.workspace = true
pdfcraft-model = { workspace = true }
pdfcraft-xfa = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
rustix = { version = "1", features = ["fs"] }
