[package]
name = "pdfcraft-library"
description = "The document library (an index in a synced folder, with full-text search) and the encrypted vault (L4)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Page count and text for the library's full-text index (L3).
pdfcraft-render = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
sha2 = "0.11"
base64 = "0.23"
# The vault: AES-256-GCM for documents and the wrapped key (RustCrypto, Apache-2.0 OR MIT) and
# Argon2id for the key derived from the passphrase (RustCrypto, MIT OR Apache-2.0).
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Random bytes come from Web Crypto in the browser.
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The login keychain holds the unwrapped vault key behind user presence (MIT OR Apache-2.0; also
# used by pdfcraft-assist and pdfcraft-sign). `OSX_10_15` is the data protection keychain, the one
# that supports access control.
security-framework = { version = "3.7", features = ["OSX_10_15"] }

[dev-dependencies]
tempfile = "3.27"
